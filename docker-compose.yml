services:
  mongo:
    image: mongo:7
    container_name: toolshare-mongo
    restart: unless-stopped
    # Replica set à un seul nœud : indispensable pour les transactions MongoDB
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - db_data:/data/db
    healthcheck:
      # Initialise le replica set au premier lancement,
      # puis devient "healthy" quand le nœud est PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { if (rs.status().myState === 1) quit(0); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); } quit(1);"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  backend:
    build: .
    container_name: toolshare-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/toolshare?replicaSet=rs0
    ports:
      - "${API_PORT:-3001}:3000"
    volumes:
      # Le code est monté dans le conteneur : toute modification est prise en compte (hot-reload)
      - .:/app
      # Garde les node_modules du conteneur (ne pas écraser par ceux de la machine)
      - /app/node_modules
    command: ["npx", "nodemon", "--legacy-watch", "src/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  db_data:
